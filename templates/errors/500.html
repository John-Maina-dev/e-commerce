{% extends 'base.html' %}
{% block title %}Server error · {{ site_settings.store_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-icon">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
  </div>
  <h1 class="error-code">500</h1>
  <h2>Something went wrong</h2>
  <p class="muted">An unexpected error occurred. We've been notified and are looking into it. Please try again shortly.</p>
  <a class="btn" href="{% url 'home' %}">Back to store</a>
</div>
{% endblock %}
