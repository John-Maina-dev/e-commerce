{% extends 'base.html' %}
{% block title %}Access denied · {{ site_settings.store_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <h1 class="error-code">403</h1>
  <h2>Access denied</h2>
  <p class="muted">You don't have permission to view this page. If you think this is a mistake, contact the store owner.</p>
  <a class="btn" href="{% url 'home' %}">Back to store</a>
</div>
{% endblock %}
