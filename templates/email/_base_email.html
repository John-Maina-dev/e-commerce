<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.store_name }}</title>
<style>
  body { margin: 0; padding: 0; background: #f4f2ef; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #221d18; }
  .shell { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e7e1d8; border-radius: 12px; overflow: hidden; }
  .head { background: {{ site.primary_color|default:'#7c3aed' }}; color: #ffffff; padding: 24px 32px; }
  .head h1 { margin: 0; font-size: 20px; }
  .head p { margin: 4px 0 0; opacity: .85; font-size: 13px; }
  .body { padding: 32px; font-size: 15px; line-height: 1.6; }
  .body h2 { font-size: 18px; margin: 0 0 12px; }
  .body p { margin: 0 0 16px; }
  .btn { display: inline-block; background: {{ site.primary_color|default:'#7c3aed' }}; color: #ffffff !important; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; }
  .btn-muted { background: #f4f2ef; color: #221d18 !important; }
  .card { background: #faf8f5; border: 1px solid #e7e1d8; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .card table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .card td { padding: 6px 0; }
  .muted { color: #8a7f70; font-size: 13px; }
  .total { font-size: 18px; font-weight: 700; border-top: 2px solid #e7e1d8; margin-top: 8px; padding-top: 12px; }
  .foot { padding: 20px 32px; background: #faf8f5; text-align: center; font-size: 12px; color: #8a7f70; border-top: 1px solid #e7e1d8; }
  .badge { display: inline-block; background: #eef2ff; color: #4338ca; border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 24px 12px;"><tr><td align="center">
  <div class="shell">
    <div class="head">
      <h1>{{ site.store_name }}</h1>
      {% if site.tagline %}<p>{{ site.tagline }}</p>{% endif %}
    </div>
    <div class="body">
      {% block body %}{% endblock %}
    </div>
    <div class="foot">
      {% if site.footer_text %}<p style="margin: 0 0 6px;">{{ site.footer_text }}</p>{% endif %}
      <p style="margin: 0;">{{ site.store_name }} · {{ site.phone }}{% if site.contact_email %} · {{ site.contact_email }}{% endif %}</p>
    </div>
  </div>
  </td></tr></table>
</body>
</html>
